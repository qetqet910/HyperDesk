name: "Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> src-tauri/target

      - name: Install Dependencies
        run: npm ci

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HyperDesk ${{ github.ref_name }}"
          # 변경 사항을 여기 하드코딩하지 말 것 — 이전에 그렇게 두었다가 몇 번의
          # 릴리즈 동안 낡은 내용이 그대로 게시됐다(releaseDraft:false라 검토 없이
          # 바로 공개된다). 커밋 목록이 유일하게 항상 최신인 출처다.
          releaseBody: 'HyperDesk ${{ github.ref_name }} 릴리즈입니다.\n\n변경 사항은 아래 **Commits** 목록을 참고하세요.\n\n설치는 [Microsoft Store](https://apps.microsoft.com/detail/9NPVXL622ZQQ)를 이용해 주세요 — 여기 첨부되는 `.msixbundle`은 Store 제출용 미서명 원본이라 직접 설치되지 않습니다.'
          releaseDraft: false
          prerelease: false

