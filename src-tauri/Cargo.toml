[package]
name = "hyperdesk"
version = "1.3.0"
description = "Hyper-V VM Manager"
authors = ["HyperDesk"]
edition = "2021"
build = "build.rs"

[lib]
name = "hyperdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["net", "time", "rt", "macros"] }
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    # ↓ keydiag(진단 전용, HYPERDESK_KEYDIAG=1 일 때만 동작) 에서만 쓴다.
    "Win32_UI_Input",                    # Raw Input (RegisterRawInputDevices / WM_INPUT)
    "Win32_UI_Accessibility",            # SetWinEventHook (EVENT_SYSTEM_FOREGROUND)
    "Win32_System_StationsAndDesktops",  # window station / desktop 이름
    "Win32_System_RemoteDesktop",        # ProcessIdToSessionId
    "Win32_System_LibraryLoader"         # GetModuleHandleW (진단 창 클래스 등록)
] }
sysinfo = "0.38.4"
futures = "0.3.32"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
